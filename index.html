<meta charset="UTF-8">

<style>

/* =========================
   FONTS
   ========================= */

@font-face {
    font-family: "Melodrame";
    src: url("https://raw.githubusercontent.com/HomoIrrealis/HomoIrrealis.github.io/main/assets/fonts/Relationship%20of%20m%C3%A9lodrame.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

@font-face {
    font-family: "Lion";
    src: url("https://raw.githubusercontent.com/HomoIrrealis/HomoIrrealis.github.io/main/assets/fonts/Lion.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

@font-face {
    font-family: "Abar";
    src: url("https://raw.githubusercontent.com/HomoIrrealis/HomoIrrealis.github.io/main/assets/fonts/AbarHigh-Regular.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

@font-face {
    font-family: "Azar";
    src: url("https://raw.githubusercontent.com/HomoIrrealis/HomoIrrealis.github.io/main/assets/fonts/Azar.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}


/* =========================
   MAIN PAGE
   ========================= */

* {
    box-sizing: border-box;
}

html {
    margin: 0;
    padding: 0;
}

body {
    margin: 0;
    padding: 0;
    overflow-y: auto;

    font-family: "Abar", sans-serif;
    color: #FEF4AF;
    background: #335C67;
}


/* =========================
   MAIN CONTAINERS
   ========================= */

#Grannyone {
    width: 520px;

    margin-left: auto;
    margin-right: auto;

    padding-left: 20px;
    padding-right: 20px;
}

#Granny {
    width: 400px;

    margin-left: auto;
    margin-right: auto;

    border: 1px solid #FEF4AF;
}


/* =========================
   LINKS
   ========================= */

a {
    font-family: "Lion", sans-serif;

    color: #FEF4AF;
    text-decoration: none;

    transition: .1s;
}

a:hover {
    color: #FEF4AF;
    text-decoration: none;
}

a:visited {
    color: #FEF4AF;
}


/* =========================
   PAGE NAVIGATION
   ========================= */

#no {
    height: 20px;
    width: 380px;

    float: right;

    padding: 2px;
    padding-bottom: 0;
    padding-top: 3px;

    margin-bottom: 35px;
    margin-right: 10px;
}


/* =========================
   POSTS GRID
   ========================= */

.posts-grid {
    width: 100%;

    display: flex;
    flex-wrap: wrap;

    justify-content: center;
    align-items: flex-start;

    gap: 14px;
}


/* =========================
   POST ITEMS
   ========================= */

.post-item {
    width: calc(50% - 7px);

    box-sizing: border-box;

    margin: 0;
}


/* =========================
   FIXED POST
   ========================= */

.post-item:first-child {
    width: 100%;
    margin: 0;
}


/* =========================
   POST BOX
   ========================= */

.post-item .Main {

    direction: ltr;

    width: 100%;

    box-sizing: border-box;

    border: 1px solid #FEF4AF;

    margin: 0;

    padding-right: 0;
}

.post-item:first-child .Main {
    padding-right: 5px;
}


/* =========================
   NORMAL POSTS
   ========================= */

.post-item:not(:first-child) .Main {
    min-height: 190px;
}


/* =========================
   POST
   ========================= */

.MP {
    padding-bottom: 10px;
}

.Mc {
    padding-bottom: 2px;

    font-size: 7pt;

    direction: rtl;

    color: #FEF4AF;

    text-align: right;

    letter-spacing: 1px;

    font-family: "Lion", sans-serif;
}

.post-item:not(:first-child) .Mc {
    display: none;
}


/* =========================
   POST TITLE
   ========================= */

.THP {

    font-size: 15px;

    text-align: right;

    padding-top: 5px;

    margin-left: auto;
    margin-right: auto;

    font-weight: bold;

    direction: rtl;

    font-family: "Lion", sans-serif;
}

.post-item:not(:first-child) .THP {

    text-align: center;

    padding-top: 10px;
    padding-left: 5px;
    padding-right: 5px;
}


/* =========================
   POST CONTENT
   ========================= */

.PTB {

    width: 100%;
    max-width: 100%;

    box-sizing: border-box;

    word-wrap: break-word;
    overflow-wrap: break-word;

    direction: rtl;

    padding: 1px;

    font-size: 13px;

    text-align: right;

    line-height: 155%;

    padding-top: 10px;
    padding-right: 0;

    font-family: "Abar", sans-serif;
}

.post-item:not(:first-child) .MP {
    display: none;
}


/* =========================
   POST CONTENT IMAGES
   ========================= */

.PTB img {
    max-width: 100%;
    height: auto;
}


/* =========================
   PREVIEW IMAGE
   ========================= */

.preview-image {

    width: 160px;
    height: 120px;

    object-fit: cover;

    display: block;

    margin: 12px auto 10px auto;

    border: 1px solid #FEF4AF;

    box-sizing: border-box;
}

.preview-no-image {

    width: 160px;
    height: 120px;

    margin: 12px auto 10px auto;

    border: 1px solid #FEF4AF;

    box-sizing: border-box;

    display: flex;

    align-items: center;
    justify-content: center;

    font-family: "Lion", sans-serif;

    font-size: 9pt;

    direction: rtl;
}


/* =========================
   VIEW TEXT BUTTON
   ========================= */

.preview-link {

    display: block;

    width: fit-content;

    margin: 8px auto 12px auto;

    padding: 4px 9px;

    border: 1px solid #FEF4AF;

    font-family: "Lion", sans-serif;

    font-size: 9pt;

    color: #335C67 !important;

    background: #FEF4AF;

    text-decoration: none;

    direction: rtl;

    text-align: center;

    box-sizing: border-box;
}

.preview-link:hover {

    color: #FEF4AF !important;

    background: #335C67;

    text-decoration: none;
}


/* =========================

   ========================= */

.Titlebox {

    text-align: center;

}


.Title {

}

.Title:hover {

    text-decoration: none;

}


/* =========================
   TOP BUTTONS
   ========================= */

#Topright {

    padding-top: 10px;
    padding-bottom: 5px;

}


#Topleft {

    width: 60px;

    text-align: center;

    padding-top: 10px;
    padding-bottom: 5px;

    margin-left: auto;

}


/* =========================
   SIDE
   ========================= */

#side {

    margin-right: auto;
}

#col {

    height: auto;
    overflow: hidden;

    width: 300px;
    max-width: 300px;

    text-align: center;

    font-size: 9pt;

    padding-bottom: 5px;

    border: 1px solid #FEF4AF;

    margin-bottom: 15px;

    margin-left: auto;
    margin-right: auto;

    font-family: "Lion", sans-serif;
}


/* =========================
   ABOUT
   ========================= */

.Titleabout {

    font-family: "Azar", sans-serif;

    border: 1px solid #FEF4AF;

    margin-bottom: 10px;

    border-right-width: 0;

    cursor: pointer;

.Titleabout:hover {

    text-decoration: none;

}

.colabout {

    overflow: hidden;

    width: 300px;
    max-width: 300px;

    text-align: center;

    font-size: 9pt;

    padding-bottom: 10px;

/* =========================

.Titlelink {

}

.Titlelink:hover {

    color: #335C67;

}

.collink {

    height: auto;

    text-align: center;

@media screen and (max-width: 700px) {

@media screen and (max-width: 480px) {

    }

    }

<script>

/* =========================
   BLOG DATA
   =========================

   بعداً پنل مدیریت این بخش را
   به صورت خودکار مدیریت می‌کند.
*/

const posts = [

    {
        id: 1,

        title: "نمونه نوشته",

        date: "۱۵ مرداد ۱۴۰۵",

        time: "22:00",

        author: "DIAN",

        category: "notes",

        tags: [
            "یادداشت",
            "ایماژ"
        ],

        image: "",

        content: `
            <p>
                این یک نوشته‌ی نمونه است.
            </p>

            <p>
                محتوای واقعی نوشته‌های وبلاگ
                بعداً از طریق پنل مدیریت وارد خواهد شد.
            </p>
        `
    },

    {
        id: 2,

        title: "نمونه اثر",

        date: "۱۴ مرداد ۱۴۰۵",

        time: "18:30",

        author: "DIAN",

        category: "projects",

        tags: [
            "پروژه",
            "اثر"
        ],

        image: "",

        content: `
            <p>
                این قسمت برای نمایش یک اثر نمونه است.
            </p>
        `
    },

    {
        id: 3,

        title: "یک یادداشت دیگر",

        date: "۱۳ مرداد ۱۴۰۵",

        time: "16:00",

        author: "DIAN",

        category: "studies",

        tags: [
            "مطالعات"
        ],

        image: "",

        content: `
            <p>
                محتوای نمونه‌ی نوشته.
            </p>
        `
    }

];


/* =========================
   CREATE POST
   ========================= */

function createPost(post, index) {

    const article = document.createElement("div");

    article.className = "post-item";

    let imageHTML = "";

    if (post.image) {

        imageHTML = `
            <img
                src="${post.image}"
                class="preview-image"
                alt="${escapeHTML(post.title)}"
            >
        `;

    } else {

        imageHTML = `
            <div class="preview-no-image">
                بدون تصویر
            </div>
        `;

    }


    article.innerHTML = `

        <div class="Main">

            <div class="THP">

                <a href="post.html?id=${post.id}">
                    ${escapeHTML(post.title)}
                </a>

            </div>


            <div class="MP">

                <div class="PTB">

                    ${post.content}

                    ${
                        post.tags && post.tags.length
                        ?
                        `
                        <br>

                        <span style="font-size:8pt">
                            برچسب ها &nbsp;:&nbsp;
                        </span>

                        ${post.tags.map(tag => `
                            <a href="tag.html?tag=${encodeURIComponent(tag)}">
                                <span style="font-size:8pt">
                                    ${escapeHTML(tag)}
                                </span>
                            </a>
                        `).join("، ")}
                        `
                        :
                        ""
                    }

                </div>

            </div>


            <div class="Mc">

                <a href="post.html?id=${post.id}">
                    &nbsp;+ بیشتر&nbsp;
                </a>

            </div>


            <div class="Mc">

                ${escapeHTML(post.date)}

                &nbsp;|&nbsp;

                ${escapeHTML(post.time)}

                &nbsp;|&nbsp;

                ${escapeHTML(post.author)}

            </div>


            ${
                index !== 0
                ?
                `
                <div class="post-preview">

                    ${imageHTML}

                    <a
                        href="post.html?id=${post.id}"
                        class="preview-link"
                    >
                        مشاهده/متن
                    </a>

                </div>
                `
                :
                ""
            }

        </div>
    `;


    return article;
}


/* =========================
   RENDER POSTS
   ========================= */

function renderPosts() {

    const container =
        document.getElementById("posts-container");

    container.innerHTML = "";

    posts.forEach((post, index) => {

        container.appendChild(
            createPost(post, index)
        );

    });

}


/* =========================
   TAGS
   ========================= */

function renderTags() {

    const container =
        document.getElementById("tag-list");

    const tags = {};

    posts.forEach(post => {

        if (!post.tags) return;

        post.tags.forEach(tag => {

            if (!tags[tag]) {
                tags[tag] = 0;
            }

            tags[tag]++;

        });

    });


    container.innerHTML =
        Object.keys(tags).map(tag => {

            return `
                <a
                    href="tag.html?tag=${encodeURIComponent(tag)}"
                    style="font-size:9pt;display:block"
                >
                    ${escapeHTML(tag)}
                    (${tags[tag]})
                </a>
            `;

        }).join("");

}


/* =========================
   ARCHIVE
   ========================= */

function renderArchive() {

    const container =
        document.getElementById("archive-list");

    container.innerHTML =
        posts.map(post => {

            return `
                <a
                    href="post.html?id=${post.id}"
                    style="font-size:9pt;display:block"
                >
                    ${escapeHTML(post.title)}
                </a>
            `;

        }).join("");

}


/* =========================
   SIDEBAR
   ========================= */

function toggleSection(section) {

    const sections = [
        "categories",
        "links",
        "tags",
        "archive"
    ];

    sections.forEach(name => {

        const element =
            document.getElementById(
                "section-" + name
            );

        if (!element) return;

        if (name === section) {

            if (
                element.style.display === "block"
            ) {

                element.style.display = "none";

            } else {

                element.style.display = "block";

            }

        } else {

            element.style.display = "none";

        }

    });

}


/* =========================
   PROFILE
   ========================= */

function goProfile() {

    window.location.href =
        "profile.html";

}


/* =========================
   SECURITY / HTML ESCAPE
   ========================= */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent = value;

    return div.innerHTML;

}


/* =========================
   INITIALIZE
   ========================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderPosts();

        renderTags();

        renderArchive();

    }
);

</script>
